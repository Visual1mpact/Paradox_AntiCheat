<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paradox AntiCheat | Documentation Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Core & Extensions CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="loader">
      <div class="cyber-spinner"></div>
      <span class="loader-text">INITIALIZING PARADOX INTERFACE...</span>
    </div>
  </div>

  <script>
    window.$docsify = {
      name: '<div class="brand-title"><span class="brand-icon">⚡</span> Paradox Security</div>',
      repo: 'https://github.com/visual1mpact/Paradox_AntiCheat',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      alias: { '/.*_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      auto2top: true,
      executeScript: true,
      mergeNavbar: true,
      el: '#app',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search commands, modules, security...',
        noData: 'No matching Paradox parameters found.',
        depth: 6
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'dark',
        tabComments: true,
        tabHeadings: true
      },
      pagination: {
        previousText: 'PREVIOUS SYSTEM',
        nextText: 'NEXT SYSTEM',
        crossChapter: true,
        crossChapterText: true,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>

  <!-- Docsify Core v4 & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <!-- Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
