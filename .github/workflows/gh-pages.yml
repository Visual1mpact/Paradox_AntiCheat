name: Deploy static content to Pages

on:
  push:
    branches: ["rewrite"]
    paths:
      - 'docs/**'
  workflow_dispatch:

# Opt into Node.js 24 early to avoid deprecation warnings and future breakage
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Latest major release of checkout with Node 24 support
        uses: actions/checkout@v6  # supports Node.js 24 and runner improvements :contentReference[oaicite:1]{index=1}

      - name: Setup Pages
        # Use latest major tag for configure-pages
        uses: actions/configure-pages@v6  # (if available) otherwise stick to v5 and test Node24 :contentReference[oaicite:2]{index=2}

      - name: Upload Pages Artifact
        # Latest version for artifact upload for Pages
        uses: actions/upload-pages-artifact@v4  # Latest v4 release :contentReference[oaicite:3]{index=3}
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # Latest major for deploy-pages :contentReference[oaicite:4]{index=4}
